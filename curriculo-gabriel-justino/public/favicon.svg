<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="esfera" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#b9cdff"/>
      <stop offset="0.55" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#3355d6"/>
    </radialGradient>
    <clipPath id="frente"><rect x="0" y="16" width="32" height="16"/></clipPath>
  </defs>
  <!-- metade de trás do anel -->
  <ellipse cx="16" cy="16" rx="15" ry="5" transform="rotate(-20 16 16)" fill="none" stroke="#7aa2ff" stroke-width="2" opacity="0.5"/>
  <!-- planeta -->
  <circle cx="16" cy="16" r="9" fill="url(#esfera)"/>
  <!-- metade da frente do anel (mesma técnica do avatar-planeta) -->
  <ellipse cx="16" cy="16" rx="15" ry="5" transform="rotate(-20 16 16)" fill="none" stroke="#7aa2ff" stroke-width="2" clip-path="url(#frente)"/>
</svg>
