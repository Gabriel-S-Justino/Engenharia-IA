<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Gabriel Justino · Desenvolvedor de Software</title>
  <meta name="description" content="Gabriel Justino, estudante de ADS na UniAteneu. Desenvolvo projetos com React Native e Python, automações e soluções de software.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Roda ANTES do Angular, para a primeira pintura já sair no tema certo
    // (evita o "flash" de tema errado). Prioridade: escolha salva > sistema.
    // Fica ANTES dos <link rel="stylesheet">: um script depois de uma folha
    // de estilo externa espera ela terminar de baixar para poder rodar.
    (function () {
      var salvo = null;
      try {
        salvo = localStorage.getItem('tema');
      } catch (e) {
        // armazenamento bloqueado (ex.: aba anônima restrita): segue o sistema
      }
      var sistemaClaro = window.matchMedia('(prefers-color-scheme: light)').matches;
      if (salvo === 'light' || (salvo === null && sistemaClaro)) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Cor da barra do navegador no celular: segue o sistema na carga;
       o ToggleTema atualiza as duas quando o visitante troca o tema. -->
  <meta name="theme-color" content="#0a0f1e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">

  <!-- Endereço oficial da página (evita duplicatas em buscadores). -->
  <link rel="canonical" href="https://engenharia-ia-ten.vercel.app/">

  <!-- Open Graph: o "cartão" de preview ao compartilhar o link.
       Robôs de preview não executam JavaScript, por isso fica no HTML estático.
       URLs absolutas: muitos robôs não resolvem caminhos relativos. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://engenharia-ia-ten.vercel.app/">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Gabriel Justino · Desenvolvedor de Software">
  <meta property="og:description" content="Estudante de ADS na UniAteneu. Projetos com React Native e Python, automações e soluções de software.">
  <meta property="og:image" content="https://engenharia-ia-ten.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Planeta com anel ao lado do nome Gabriel Justino e da frase: Transformando problemas reais em soluções com tecnologia.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
</head>

</body>
</html>
